[project]
name = "deken-worker"
version = "0.1.0"
description = "Runtime común de workers de DEKEN STUDIO AI (solo conexiones salientes)"
requires-python = ">=3.12"
dependencies = [
    "deken-shared",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
]

[project.scripts]
deken-worker = "deken_worker.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deken_worker"

[tool.uv.sources]
deken-shared = { workspace = true }
